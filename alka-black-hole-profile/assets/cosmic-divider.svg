<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="52" viewBox="0 0 1200 52" role="img" aria-label="Cosmic divider">
  <defs>
    <linearGradient id="beam"><stop stop-color="#55d6ff" stop-opacity="0"/><stop offset=".3" stop-color="#55d6ff"/><stop offset=".5" stop-color="#ff9f43"/><stop offset=".7" stop-color="#8b5cf6"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
    <radialGradient id="hole"><stop offset=".55" stop-color="#000"/><stop offset=".72" stop-color="#ffcf82"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.ring{animation:spin 6s linear infinite;transform-origin:600px 26px}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <path d="M70 26H1130" stroke="url(#beam)" stroke-width="2"/>
  <circle cx="600" cy="26" r="20" fill="url(#hole)"/>
  <ellipse class="ring" cx="600" cy="26" rx="34" ry="8" fill="none" stroke="url(#beam)" stroke-width="3" stroke-dasharray="9 6" filter="url(#glow)" transform="rotate(-12 600 26)"/>
  <circle cx="558" cy="26" r="2" fill="#55d6ff"/><circle cx="642" cy="26" r="2" fill="#8b5cf6"/>
</svg>
